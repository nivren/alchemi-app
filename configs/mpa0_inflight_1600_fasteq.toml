# All relative paths are resolved from the alchemi-app project root.

[run]
mode = "batch_compare"
output_dir = "artifacts/mpa0-inflight1600-fasteq-refill20-20261005"
dtype = "float64"
inference_backends = ["fasteq"]
wall_seconds = 1800
process_timeout_seconds = 1920
components = true

[environment]
HIP_VISIBLE_DEVICES = "4" # physical HCU 4 is exposed to PyTorch as cuda:0
OMP_NUM_THREADS = "1"

[inputs]
selection = "artifacts/mpa0-inflight-1600-selection-20261005.json"
checkpoint = "/home/wangleping/.cache/mace/mace-mpa-0-medium.model"

[batch]
mode = "atoms"
max_atoms = 20000
refill_frequency = 20
max_updates_per_structure = 500

[optimizer]
name = "fire"
dt = 0.1
dt_max = 1.0
dt_min = 0.002
maxstep = 0.2
n_min = 5
f_inc = 1.1
f_dec = 0.5
alpha_start = 0.1
f_alpha = 0.99

[convergence]
force_tolerance_eV_A = 0.05
force_overflow_eV_A = 100.0

[neighbors]
backend = "torch_reference"
cutoff_A = 6.0
skin_A = 0.0
max_neighbors_per_atom = 512
